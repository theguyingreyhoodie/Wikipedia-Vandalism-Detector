[project]
name = "wikivand"
version = "0.1.0"
description = "Real-time Wikipedia vandalism and edit-war detection with delayed revert labels"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "scikit-learn>=1.4", "joblib"]

[project.optional-dependencies]
embed = ["sentence-transformers>=3"]
dev = ["pytest>=8"]

[project.scripts]
wikivand = "wikivand.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wikivand"]
